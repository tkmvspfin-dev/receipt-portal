<script>
    // Make sure your live URL link is pasted here inside the quotes
    const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbwGg2lYpT8CzVuLMmNx3IrB5_2Jap7VfygDwZOA6A4EPXpNDIx4mwEKIgaHoPInFX0CHw/exec";

    let globalDirectory = {};

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('paymentDate').valueAsDate = new Date();
      setupYearDropdown();
      
      fetch(GOOGLE_API_URL)
        .then(res => res.json())
        .then(directory => {
          globalDirectory = directory;
          const nameDropdown = document.getElementById('memberName');
          nameDropdown.innerHTML = '<option value="" disabled selected>Choose a member name...</option>';
          
          Object.keys(directory).sort().forEach(name => {
            let opt = document.createElement('option');
            opt.value = name; opt.innerHTML = name;
            nameDropdown.appendChild(opt);
          });
        })
        .catch(err => alert("Connection error loading names directory: " + err));
    });

    function autoPopulateDetails() {
      const selectedName = document.getElementById('memberName').value;
      const profile = globalDirectory[selectedName];
      if (profile) {
        document.getElementById('itsNumber').value = profile.its || "N/A";
        document.getElementById('emailId').value = profile.email || "N/A";
      }
    }

    function setupYearDropdown() {
      const yearSelect = document.getElementById('year');
      const currentYear = new Date().getFullYear();
      for (let y = 2000; y <= 2099; y++) {
        let opt = document.createElement('option'); opt.value = y; opt.innerHTML = y;
        if(y === currentYear) opt.selected = true;
        yearSelect.appendChild(opt);
      }
    }

    function handleFormSubmit(event) {
      event.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Submitting to Google Ledger...';
      
      // Package details into standard URL parameters format string
      var urlEncodedData = new URLSearchParams();
      urlEncodedData.append("memberName", document.getElementById('memberName').value);
      urlEncodedData.append("paymentDate", document.getElementById('paymentDate').value);
      urlEncodedData.append("amountReceived", document.getElementById('amountReceived').value);
      urlEncodedData.append("paymentMode", document.getElementById('paymentMode').value);
      urlEncodedData.append("emailId", document.getElementById('emailId').value);
      urlEncodedData.append("quarter", document.getElementById('quarter').value);
      urlEncodedData.append("year", document.getElementById('year').value);

      // Transmit via standard application/x-www-form-urlencoded pattern
      fetch(GOOGLE_API_URL, {
        method: "POST",
        mode: "no-cors", 
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: urlEncodedData.toString()
      })
      .then(() => {
        // Pop the success overlay checkmark right away
        document.getElementById('statusOverlay').classList.add('active');
      })
      .catch(err => {
        alert("Submission failure: " + err);
        resetPortal();
      });
    }

    function resetPortal() {
      document.getElementById('receiptForm').reset();
      document.getElementById('paymentDate').valueAsDate = new Date();
      document.getElementById('statusOverlay').classList.remove('active');
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-paper-plane"></i> Commit Entry to Google Sheets';
    }
  </script>
